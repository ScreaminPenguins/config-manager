#######################################################################
# Key Bindings

# Set leader key
unbind-key C-b
set-option -g prefix C-r
bind-key C-r send-prefix

# Set pane navigation to vim keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Set pane splits
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"

# Set client navigation
bind-key n switch-client -n
bind-key p switch-client -p

# Set up mouse functionality and vi navigation keys
setw -g mode-keys vi
setw -g mouse on

# Allow proper color rendering when using k9s/lazygit/etc... in tmux session.
#
# This MUST stay xterm-256color, not the "more correct" tmux-256color. Go/tcell
# apps (k9s, lazygit) decide truecolor purely from tcell's *built-in* terminfo
# table: its xterm-256color entry carries RGB caps, its tmux-256color entry does
# not. Under tmux-256color, k9s quantises its skin to the 256-colour palette
# (#1f1f28 -> index 234 = #1c1c1c), so the skin colours shift AND the background
# stops matching kitty's default background -- and kitty only applies
# background_opacity to cells whose bg equals the default bg, so transparency is
# lost too. COLORTERM=truecolor does not help (tcell ignores it) and neither does
# a hand-rolled direct-colour terminfo entry (tcell never reads the system db).
set -g default-terminal "xterm-256color"

# Advertise what kitty (the outer terminal) can actually do. tmux's built-in
# feature sets only match xterm*/screen*/rxvt*, so for xterm-kitty tmux derives
# just bpaste,ccolour,clipboard,cstyle,focus,RGB,title (RGB comes free from
# kitty's `Tc` cap) -- notably no `sync`. Without `sync` tmux repaints the pane
# incrementally with the cursor visible, which is why the nvim cursor visibly
# darts across the screen on every redraw. This line is what fixes the flicker;
# it is independent of default-terminal above.
set -as terminal-features ",xterm-kitty:RGB:sync:extkeys:usstyle:hyperlinks"

#######################################################################
# Plugins
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'christoomey/vim-tmux-navigator'
set-option -g @plugin 'erikw/tmux-powerline'

#######################################################################
# Initialize TMUX plugin manager 
# (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
